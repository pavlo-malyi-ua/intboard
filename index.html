<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntBoard</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">

    <div class="logo">
        📚 IntBoard
    </div>

    <div class="sidebar-header">
        <span>Класи</span>
        <button onclick="addClass()">+</button>
    </div>

    <div id="classList"></div>

</div>

<div class="workspace">

    <div class="topbar">

        <div id="tabs"></div>

        <button class="new-tab" onclick="addTopic()">
            + Тема
        </button>

    </div>

    <div class="toolbar">

        <input type="color" id="color" value="#000000">

        <input type="range" id="size" min="1" max="20" value="3">

        <button onclick="clearBoard()">Очистити</button>

        <button onclick="saveBoard()">PNG</button>

    </div>

    <canvas id="board"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
