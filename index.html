<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntBoard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="toolbar">
    <input type="color" id="color" value="#000000">
    <input type="range" id="size" min="1" max="50" value="3">
    <button id="pencilBtn">✏️ Олівець</button>
    <button onclick="eraser()">🧽 Гумка</button>
    <button onclick="clearBoard()">🗑️ Очистити</button>
    <button onclick="saveBoard()">💾 PNG</button>

</div>

<canvas id="board"></canvas>

<script src="script.js"></script>

</body>
</html>
