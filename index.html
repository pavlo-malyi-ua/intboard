<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IntBoard</title>

<style>
body{
    margin:0;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

header{
    background:#2563eb;
    color:white;
    padding:15px;
}

canvas{
    border:2px solid #333;
    margin:20px auto;
    display:block;
    background:white;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>📚 IntBoard</h1>
    <p>Онлайн дошка для вчителя</p>
</header>

<button onclick="clearBoard()">Очистити дошку</button>

<canvas id="board" width="1000" height="600"></canvas>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

let drawing = false;

canvas.addEventListener("mousedown", () => {
    drawing = true;
});

canvas.addEventListener("mouseup", () => {
    drawing = false;
    ctx.beginPath();
});

canvas.addEventListener("mousemove", draw);

function draw(e){
    if(!drawing) return;

    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";

    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
}

function clearBoard(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
}
</script>

</body>
</html>
